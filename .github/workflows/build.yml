name: Build and Push Docker Image

on:
  push:
    branches:
      - main
      - custom
      - v3
      - v4
      - v6
      - 'v*'
    tags:
      - 'v*'
  workflow_dispatch:
  release:
    types: [published, created, edited]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from git tags
        id: version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            V="${{ github.ref_name }}"
          elif [[ "${{ github.ref_name }}" =~ ^v[0-9]+ ]]; then
            V="${{ github.ref_name }}"
          else
            V=$(git describe --tags --match "v[0-9]*" --always | cut -d'-' -f1)
          fi
          echo "VERSION=${V}" >> "$GITHUB_OUTPUT"
          echo "VERSION_NUM=${V#v}" >> "$GITHUB_OUTPUT"

      - name: Prepare lowercase image name
        run: |
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.version.outputs.VERSION }}
          annotations: |
            type=org.opencontainers.image.description, value=Downtify with playlist suggestions, public sharing links, Cast support, and upgrade repairs.
            type=org.opencontainers.image.url, value=https://github.com/${{ github.repository }}
            type=org.opencontainers.image.source, value=https://github.com/${{ github.repository }}
            type=org.opencontainers.image.version, value=${{ steps.version.outputs.VERSION }}
            type=org.opencontainers.image.licenses, value=AGPL-3.0
            type=org.opencontainers.image.title, value=Downtify

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.VERSION }}
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.VERSION_NUM }}
          platforms: linux/amd64,linux/arm64
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}