name: Build and Release Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'downtify/**'
      - '.github/workflows/apk.yml'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release-apk:
    name: Build APK & Upload to Latest Release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure gradlew is executable
        working-directory: android
        run: chmod +x gradlew

      - name: Decode release keystore (if configured)
        id: keystore
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "DOWNTIFY_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "DOWNTIFY_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "DOWNTIFY_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "DOWNTIFY_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> "$GITHUB_ENV"
          fi

      - name: Build Release APK
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Package APK & Checksum
        id: package
        run: |
          TAG=$(gh release view --json tagName -q .tagName 2>/dev/null || echo "v11")
          if [ -z "$TAG" ]; then TAG="v11"; fi
          APK_NAME="downtify-${TAG}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$APK_NAME"
          sha256sum "$APK_NAME" > "${APK_NAME}.sha256"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "apk=$APK_NAME" >> "$GITHUB_OUTPUT"
          ls -lh "$APK_NAME" "${APK_NAME}.sha256"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.apk }}
          path: |
            ${{ steps.package.outputs.apk }}
            ${{ steps.package.outputs.apk }}.sha256
          retention-days: 90

      - name: Update Tag & Upload APK to Latest GitHub Release
        run: |
          TAG="${{ steps.package.outputs.tag }}"
          APK="${{ steps.package.outputs.apk }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "$TAG" "${{ github.sha }}"
          git push origin "refs/tags/$TAG" --force
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "${APK}.sha256" --clobber
          else
            gh release create "$TAG" "$APK" "${APK}.sha256" --title "$TAG" --notes "Downtify $TAG release with native Android APK"
          fi
